name: hvf-reliability

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  hvf-arm64:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Prepare kernel and initramfs
        run: |
          mkdir -p images
          curl -L \
            -o images/linux \
            https://deb.debian.org/debian/dists/bullseye/main/installer-arm64/current/images/netboot/debian-installer/arm64/linux
          scripts/build-initramfs.sh

      - name: Baseline build
        run: zig build

      - name: HVF smoke boot
        run: |
          mkdir -p artifacts
          M80_TEST_KERNEL=images/linux \
          M80_TEST_INITRD=images/m80-initramfs.cpio.gz \
          M80_TEST_SERIAL_EXPECT="m80 initramfs: boot ok" \
          zig build test -- --test-filter "smoke: hvf arm64 boot emits serial output" \
            2>&1 | tee artifacts/hvf-smoke.log

      - name: HVF reliability loop
        run: |
          cycles=20
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            cycles=200
          fi
          ARTIFACTS_DIR=artifacts \
          scripts/run-hvf-reliability.sh images/linux images/m80-initramfs.cpio.gz "${cycles}" "m80 initramfs: boot ok"

      - name: Parse timeout and trap summaries
        if: always()
        run: |
          mkdir -p artifacts
          log_path="artifacts/hvf-reliability.log"
          timeout_count=0
          trap_count=0
          if [[ -f "${log_path}" ]]; then
            timeout_count="$(grep -c "VcpuStopTimeout" "${log_path}" || true)"
            trap_count="$(grep -c "unknown sysreg trap" "${log_path}" || true)"
          fi
          {
            echo "VcpuStopTimeout count: ${timeout_count}"
            echo "unknown sysreg trap count: ${trap_count}"
          } | tee artifacts/hvf-summary.txt

      - name: Upload HVF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvf-reliability-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
